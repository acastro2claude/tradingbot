# All strategy and study numbers live here. Code reads them; logic never hard-codes them.
# [bot] mirrors STRATEGY.md section 5. Items that are TBD in STRATEGY.md are left
# as comments, not given values.

[market]
instrument = "MES"
tick_size = 0.25
point_value_usd = 5.0          # $1.25 per tick
timezone = "America/New_York"
session_start_et = "18:00"     # Sunday 18:00 open belongs to Monday's session
session_end_et = "17:00"
rth_start_et = "09:30"         # regular trading hours, used only to split results
rth_end_et = "16:00"

[bot]
contracts_per_trade = 5             # owner (Oct 2026): start with 5 MES on the 100K Topstep account (was 10)
max_trades_per_day = 0              # 0 = no cap (proposed, TBD): the daily loss stop limits the day instead
daily_loss_limit_usd = 500          # owner (Oct 2026): no new trades once the day's closed trades reach -$500
no_new_entries_after_et = "16:30"
close_open_trade_at_et = "16:50"
# Owner (30 Oct 2026): CPI, employment and jobs reports, PMI, job openings, Fed decisions.
# PMI = "US Manufacturing PMI" (owner): S&P Global, 09:45 ET, flash and final; ISM Manufacturing (10:00) comes
# the same morning as the final. Read as (proposed): payrolls, ADP, weekly jobless claims, those PMIs, JOLTS.
news_events = ["CPI", "jobs report", "ADP employment", "jobless claims", "US Manufacturing PMI", "ISM Manufacturing PMI",
               "JOLTS job openings", "Fed decision"]
news_blackout_before_min = 15
news_blackout_after_min = 30     # at least this long
no_trading_days = ["Fed decision"]        # owner (30 Oct 2026): no trading at all on Fed days, "those days are crazy"
# Owner (30 Oct 2026): skip only around the news; trade again once volume settles, usually 30-60 minutes after.
news_blackout_max_after_min = 60          # proposed, TBD
news_settle_window_min = 5                # proposed: volume over the last 5 minutes ...
news_settle_volume_x_normal = 1.5         # ... back under 1.5x normal for that time of day (proposed)
news_normal_volume_sessions = 20          # normal = average of the last 20 sessions at that time (proposed)
close_before_news_min = 5
poc_lookback_sessions = 20
# poc_cluster_width_ticks = TBD  (the level study tests the widths listed below)
pocs_for_level = 2
pocs_for_strong_level = 3
recent_poc_lookback_sessions = 5           # level source B (STRATEGY.md 1e)
covered_poc_rule = "next session's value area"   # a POC inside it no longer counts
value_area_share = 0.70
# The bot's earlier supply and demand zones: rejected by the owner (Oct 2026), kept for the earlier
# studies. The course-style zones the owner uses are in [zones] below (STRATEGY.md 1b).
# sd_timeframe_minutes = TBD     (the study tests the list in [level_study])
sd_lookback_months = 1
sd_base_min_candles = 3          # proposed: candles in the chop, all through one common price
sd_zone_drawing = "last chop candle body"   # owner's choice: open to close of the candle before the move
sd_departure_min_ratio = 2.0     # sharp move: range >= 2x the last chop candle, closing beyond the chop
sd_chop_invalid_minutes = 60     # zone dies after this long inside it in a row
# zone also dies when a candle on its timeframe closes beyond the far side (proposed)
long_term_profile_months = 3     # backtest compares 1, 3 and 6
absorption_burst_contracts = 100
absorption_burst_seconds = 0.01
# absorption_hold_check = TBD    (price stays within X ticks for Y seconds)
entry_mode = "early"             # alternative: "retest"
max_entry_distance_points = 4
stop_buffer_points = 3           # the original spec (stop 3 points past the level); see max_loss_per_trade_points
max_loss_per_trade_points = 5.0  # owner (Oct 2026): "5 points hard limit for a loss"
stop_points = 4.5                # owner (Oct 2026): the stop sits 4.5 points from the entry
stop_order_type = "stop-market"  # owner (Oct 2026), after research/stop_fills.py: the exchange always fills it
first_target = "top of the last chop before the move into the level"   # owner, Oct 2026
first_target_chop_minutes = 1    # chop found on 1-minute candles (same chop rule as the zones)
min_reward_to_risk = 2.0         # owner: first target at least 2x the stop distance
runner_target = "low of that chop and breakout"                        # owner, Oct 2026
first_target_contracts = 4      # of 5
runner_contracts = 1             # alternative split: 3 / 1 / 1 (8 / 1 / 1 with 10 MES)
runner_stop_after_first_target_points = 6
# quiet_day_cutoff = TBD         (relative volume around 1)
quiet_day_factor = 0.6

[level_study]
# Data and periods
data_start = "2025-03-01"
data_end = "2026-10-24"          # exclusive: last session scored is Fri 23 Oct 2026
study_start = "2025-09-08"       # first session with 6 months (126 sessions) of history
early_check_start = "2025-04-01" # Apr-Aug 2025: second, separate period for question 1
sessions_per_month = 21

# Sessions left out
exclude_short_sessions = true    # holiday / early-close sessions (last trade before 16:00 ET)
short_session_last_bar_before_et = "16:00"

# Question 1: does price stall at POC clusters more than at other prices?
# A "test" of a price: price reaches it after being at least arm_distance away.
# The test "holds" if price then moves hold_distance back away from the level
# before it trades break_distance through it.
cluster_widths_ticks = [2, 4, 6, 8, 12]
arm_distance_points = 5
break_distance_points = 3        # same as the bot's stop buffer
hold_distances_points = [4, 6, 10]
headline_hold_distance_points = 6
outcome_horizon_minutes = 240
stall_distance_points = 3        # "paused": time until price is 3 points away on either side
control_min_distance_from_poc_ticks = 8   # "other prices" are at least 2 points from every POC
time_match_window_minutes = 60            # compare with other prices tested in the same hour

# Questions 2 and 3: does price cross low-volume areas faster? which window works best?
band_widths_ticks = [4, 8, 16]            # 1-, 2- and 4-point zones
headline_band_width_ticks = 8
relative_volume_neighborhood_points = 25  # volume compared with the average within +/- 25 points
long_term_windows_months = [1, 3, 6]
# Finer volume bands for the detailed table (zone volume / nearby average; 0 = no volume yet)
relative_volume_bins = [0.3, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0]

# Supply and demand overlay
sd_timeframes_minutes = [15, 30, 60]
sd_height_caps_points = []                # optionally also test only zones up to this tall
sd_drawings_to_compare = ["last chop candle body", "last chop candle wicks", "whole chop bodies", "whole chop wicks"]

# Statistics
bootstrap_samples = 2000
random_seed = 7

[backtest]
# Step 2 backtest of the full setup. Values marked proposed are TBD in STRATEGY.md.
level_tolerance_points = 2       # proposed: a burst counts as "at the level" within 2 points
lopsided_window_minutes = 5      # proposed: seller vs buyer burst contracts at the level, last 5 minutes
entry_cutoff_et = "15:30"        # data ends 16:00; spec says 16:30 (Topstep would need about 16:00)
flatten_et = "15:59"             # data ends 16:00; spec says 16:50 (Topstep 16:10)
# slippage (ticks) on market entries and stop exits; targets are limit orders. Set per variant.
commission_per_contract_round_trip = 1.24   # proposed, TBD (depends on broker or prop firm)
news_calendar = "research/news_calendar.csv"
# Retest entry (STRATEGY.md section 2, TBD values proposed)
retest_pullaway_points = 6       # proposed: price must pull this far away after the first test (4 caught 14-second wiggles at the open)
retest_trigger_ticks = 4         # enter once price turns 1 point off the retest high (low, for a long)
retest_max_wait_minutes = 60     # the retest must start within this long after the pull-away

# Variants: each runs on every source listed, at each slippage listed.
[[backtest.variants]]
name = "1 original (early entry)"
sources = ["your levels (POC or zone)", "recent uncovered POC", "S/D zone 15 min", "POC cluster", "no level"]
slippages = [1, 2]

[[backtest.variants]]
name = "1b original + 30 s hold check"
sources = ["your levels (POC or zone)", "no level"]
check_seconds = 30
check_ticks = 2

[[backtest.variants]]
name = "2 absorption in front of the level"
sources = ["your levels (POC or zone)", "no level"]
front_only = true

[[backtest.variants]]
name = "3a no entries before 09:45"
sources = ["your levels (POC or zone)", "no level"]
start_et = "09:45"

[[backtest.variants]]
name = "3b no entries before 10:00"
sources = ["your levels (POC or zone)", "no level"]
start_et = "10:00"

[[backtest.variants]]
name = "4a bursts of 150+"
sources = ["your levels (POC or zone)", "no level"]
min_contracts = 150

[[backtest.variants]]
name = "4b bursts of 200+"
sources = ["your levels (POC or zone)", "no level"]
min_contracts = 200

[[backtest.variants]]
name = "4c 2+ bursts at the level"
sources = ["your levels (POC or zone)", "no level"]
min_bursts = 2

[[backtest.variants]]
name = "5 retest entry"
sources = ["your levels (POC or zone)", "no level"]
entry = "retest"
front_only = true

[[backtest.variants]]
name = "6 all filters, early entry"
sources = ["your levels (POC or zone)", "no level"]
front_only = true
start_et = "10:00"
min_contracts = 150

[[backtest.variants]]
name = "7 all filters, retest entry"
sources = ["your levels (POC or zone)", "no level"]
entry = "retest"
front_only = true
start_et = "10:00"
min_contracts = 150

# Journal-style exits (the owner's 2024 trades: median loss 2.0 points, median win 4.0,
# about 3 trades a day, mostly 9:30-11:00 ET). Stop and target measured from the entry.
[[backtest.variants]]
name = "8a journal-style exits 2/4, early entry"
sources = ["your levels (POC or zone)", "no level"]
exits = "fixed"
stop_points = 2
target_points = 4
max_trades = 3

[[backtest.variants]]
name = "8b journal-style exits 2/5, early entry"
sources = ["your levels (POC or zone)", "no level"]
exits = "fixed"
stop_points = 2
target_points = 5
max_trades = 3

[[backtest.variants]]
name = "8c journal-style exits 2/4, 09:30-11:30 only"
sources = ["your levels (POC or zone)", "no level"]
exits = "fixed"
stop_points = 2
target_points = 4
max_trades = 3
end_et = "11:30"

[[backtest.variants]]
name = "8d journal-style exits 2/4, retest entry"
sources = ["your levels (POC or zone)", "no level"]
entry = "retest"
front_only = true
exits = "fixed"
stop_points = 2
target_points = 4
max_trades = 3

[book_study]
# Build step 3: the owner's Bookmap read at tests of marked levels, on the full order book.
# All values are proposals (TBD in STRATEGY.md) until the owner settles them.
level_area_points = 1.0          # "at or around" a level: within this of it (zones: of their edges)
test_arm_points = 5.0            # a test needs price to have been this far away first
test_break_points = 3.0          # this far through the level = the test failed
turn_points = 1.0                # entry once price trades this far back off the test's extreme (2 ticks fired on bid/ask bounce)
max_test_minutes = 5             # the turn must come within this long of the test start
line_lookback_minutes = 5        # a line must be there in the minutes before the test
line_multiple = 2.0              # a line = this many times the day's typical size per price
delta_seconds = 10               # owner: delta "starts to skew" the trade's way
burst_contracts_es = 50          # ES absorption burst size (the owner's MES add-on setting is 100; ES setting TBD)
burst_contracts_mes = 100
check_stop_points = 2            # quick check of each test: 4 points before 2 against, within 30 minutes
check_target_points = 4
check_minutes = 30
owner_match_minutes = 10         # an owner trade "took" a test if entered this soon after it, same way,
owner_match_points = 1.0         # within this of the level area
max_trades_per_day = 3           # bot vs owner: up to 3 trades a day, one at a time (the owner's median)
slippage_ticks = 1               # on market entries and stops
flatten_et = "15:59"

# Exit styles compared on every test (owner, Oct 2026: "try 3 and 7, and the STRATEGY.md targets").
# stop: "fixed" (stop_points from the fill), "past test" (stop_points past the test's low or high),
#       "past level" (stop_points past the level).
# target: "fixed" (target_points from the fill), "risk multiple" (target_multiple x the risk),
#         "strategy" (STRATEGY.md section 3: first target = top of the last 1-minute chop before
#         the move into the level, runner = low of that chop and breakout; skipped if the first
#         target is under min_reward_to_risk x the risk).
[[book_study.exits]]
name = "2-pt stop, 4-pt target"
stop = "fixed"
stop_points = 2
target = "fixed"
target_points = 4

[[book_study.exits]]
name = "3-pt stop, 7-pt target"
stop = "fixed"
stop_points = 3
target = "fixed"
target_points = 7

[[book_study.exits]]
name = "stop 1 pt past the test, target 2x the risk"
stop = "past test"
stop_points = 1
target = "risk multiple"
target_multiple = 2.0

[[book_study.exits]]
name = "stop 1 pt past the test, STRATEGY.md targets"
stop = "past test"
stop_points = 1
target = "strategy"

[[book_study.exits]]
name = "stop 3 pts past the level, STRATEGY.md targets"
stop = "past level"
stop_points = 3
target = "strategy"

[owner_rules]
# Rules taken from the owner's reasons on the blind review charts (Oct 2026). All values proposed.
control_lookback_s = 300         # "delta still making lower lows": the 5-minute delta extreme against the trade...
control_recent_s = 30            # ...was set in the last 30 seconds before entry
aggression_window_s = 60         # "buyers still too aggressive": the other side's aggressive volume over the last minute...
aggression_ratio = 1.2           # ...is at least 1.2x ours
retest_within_min = 60           # a retest: the same level was tested earlier, at most an hour before
retest_window_s = 120            # aggressive volume pushing into the level in the 2 minutes before each arrival
retest_weaker_ratio = 0.8        # weaker retest: at most 80% of the previous attempt's push
spike_bar_s = 15                 # absorption spike: a 15-second bar of aggressive volume into the level...
spike_multiple = 2.0             # ...at least 2x the median 15-second bar of the 15 minutes before...
spike_baseline_min = 15
spike_max_through_points = 1.0   # ...while price gets no more than 1 point past the level
divergence_lookback_min = 30     # price at or past the 30-minute high (low), delta below its value at that earlier high (low)
divergence_near_points = 1.0
zone_conflict_points = 4.0       # no long with a supply zone this close above (no short with a demand zone below)
target_min_points = 4.0          # owner's targets: the next POC in the trade's direction, at least 4 points away...
target_max_points = 20.0         # ...and at most 20 (else 2x the risk)
stop_points = 3.0
# Patient entry (owner's review: "wait", "too soon to tell"): after a test starts, enter at the
# first second, within wait_max_min, when price has turned turn_points off its extreme and is
# still within near_level_points of the level, delta has made no new extreme against the
# trade in the last control_recent_s, and our side's aggressive volume over the last
# aggression_window_s is at least the other side's. No trade if price breaks test_break_points first.
wait_max_min = 10
near_level_points = 3.0

[journal_rules]
# Day-level rules replayed on the owner's journal (research/journal_day_rules.py). Analysis grids, not bot settings.
news_minutes = ["08:30", "10:00", "14:00"]   # release minutes checked for a volume spike (ES 1-minute bars)
news_spike_ratio = 3.0           # spike: that minute's volume >= 3x the median of the 10 minutes before
news_spike_baseline_min = 10
max_trades = [1, 2, 3, 4, 5]
stop_after_losses = [1, 2, 3]
daily_loss_limit_usd = [150, 250, 400, 800]
daily_profit_stop_usd = [150, 250, 500]
skip_first_minutes = [5, 15, 30]
skip_after_news_minutes = [10, 15]
morning_end_et = "11:00"
split_date = "2024-07-01"        # robustness: first half vs second half of the journal
observe_first_trades = 3         # what-if: the first trades of each day on sim, or at half size
reference_start = "2024-04-01"   # the owner's disciplined period (owner, Oct 2026: early 2024 lacked discipline)

[zones]
# Supply and demand zones as the owner's course draws them (STRATEGY.md 1b, Oct 2026; research/zones.py).
# Values marked proposed are TBD until the owner confirms them on charts.
timeframes_minutes = [240, 120, 60, 30, 15]   # owner (Oct 2026): the valid timeframes, strongest first
# Owner: avoid overlapping zones; where zones overlap, the higher timeframe wins (research/zones.py resolve_overlaps).
candle_clock_tz = "America/Chicago"   # candles start at midnight Chicago time, like the owner's thinkorswim charts
# Basing candle (owner): the candle right before the move away, red before a rally, green before a drop.
doji_body_share = 0.10            # proposed: a doji (body at most 10% of its high-low range) also counts as a basing candle
leg_out_vs_basing_range = 1.5     # owner: the move away is roughly double the basing candle; 1.5x keeps the zones the owner OK'd
                                  # and drops the two they said did not move enough (1.3x, 1.4x)
leg_out_range_vs_average = 1.5    # proposed: and its high-low range is at least 1.5x the average of the last candles (owner example: 2.7x)
average_candles = 20              # candles in that average
leg_in_candles = 3                # candles before the base that name the pattern (rally or drop into it)
max_age_days = 31                 # owner (STRATEGY 1b): zones from up to about a month back
departure_min_heights = 1.5       # proposed: price moves 1.5x the zone's height away before it first comes back, else chop
rearm_min_points = 5.0            # proposed: a new test needs price to move away by the zone's height (at least this) first
weak_from_test = 4                # owner: from about the 4th test a zone is on its way out, unless heavy order-book pressure
chop_invalid_candles = 4          # proposed: inside for 4 candles of the zone's timeframe ends it (owner: about an hour, = 4 on 15m)
# Edges (owner's drawing, confirmed): near edge = the basing candle's open (green: bottom of body, red: top of body),
# far edge = the wick of the basing and move-away candles.
# Broken when a candle on the zone's timeframe closes beyond the far edge (proposed).
# Stop: the normal stop rules (owner: even when the zone is big), not past the zone.

[zone_study]
# How price behaves at the owner-style zones (research/zone_study.py). Analysis settings, not bot settings.
period_start = "2024-02-01"        # zones need a few weeks of history first
reference_start = "2024-04-01"     # the owner's disciplined period (also [journal_rules])
entry_from_et = "09:30"            # zone tests counted in regular hours only, like the earlier studies
last_entry_et = "15:30"
flat_et = "15:59"
near_points = 3.0                  # an owner trade is "at a zone" up to 3 points outside its near edge ([owner_rules] near_level_points)
far_points = 1.0                   # ...or up to 1 point past its far edge
random_per_day = 50                # random entries per day for the baseline
exits = [[3.0, 4.0], [3.0, 7.0]]   # stop / target in points from the fill (owner: the normal stop is 3 points past the level)
hold_stop_past_far_points = 1.0    # diagnostic only: does the zone hold as an area? stop 1 point past the far edge...
hold_targets_x_risk = [1.0, 2.0]   # ...targets 1x and 2x that risk (the owner keeps the normal stop; this is not a bot rule)
# Exits for research/zone_all_days.py: [label, "fixed" (stop/target points from the fill) or
# "edge" (stop this far past the zone's near edge, target this multiple of the risk), stop, target]
all_days_exits = [["2/4", "fixed", 2, 4], ["3/7", "fixed", 3, 7], ["3 past edge, 2x", "edge", 3, 2],
                  ["4/10", "fixed", 4, 10], ["4/12", "fixed", 4, 12]]   # 4/10 and 4/12: the owner's risk structure (Oct 2026)

[run_winners]
# Owner (Oct 2026): "a 4 point stop loss, but let winners run to about 10-12 points depending on market
# conditions (mostly meaning delta is heavily continuing in our direction, and aggressive buyers/sellers
# are still moving the same direction)". research/run_winners.py. Values marked proposed are TBD.
stop_points = 4.0
target_points = 10.0
extended_target_points = 12.0
lock_points_when_extended = 8.0  # proposed: when the trade is held past 10, the stop moves up to +8
delta_window_seconds = 60        # proposed: "delta continuing" = delta over the last 60 s is our way...
aggressor_ratio = 1.0            # ...and our side's aggressive volume over that minute is at least the other side's
random_per_day = 50

[replay_stops]
# Owner (Oct 2026): "I want to see if increasing the stop loss would help here. Some of the trades I took I
# noticed would hit a close stop loss, but then would continue in my direction... a 5 point stop to a 10 point
# reward? Two trade a day max regardless of win or lose." research/replay_stops.py, on the replay trades.
exits = [[4.0, 10.0], [5.0, 10.0]]       # [stop, target] in points
stop_curve = [3.0, 4.0, 5.0, 6.0, 8.0]   # stops tried with the 10-point target, for context only
max_trades_per_day = 2                   # owner: win or lose; one trade at a time

[topstep_risk]
# Owner (Oct 2026): Topstep closes the account at its loss limit; "the 2 cap a day is to prevent that from
# happening". research/topstep_risk.py replays the journal through a Topstep account under each daily rule.
# Topstep help center (checked Oct 2026): Maximum Loss Limit 2,000 / 3,000 / 4,500 for 50K / 100K / 150K, trailing
# the best end-of-day balance; Daily Loss Limit 1,000 / 2,000 / 3,000 (a stop for the day, possibly optional now);
# profit targets 3,000 / 6,000 / 9,000. The owner's last Combine was a 100K account (Oct 2026).
accounts = [
  { name = "100K", start = 100000, max_loss = 3000, target = 6000, daily_loss = 2000 },
  { name = "50K", start = 50000, max_loss = 2000, target = 3000, daily_loss = 1000 },
]
mll_stops_at_start_balance = false       # owner: the limit always trails the best end-of-day balance by the same
                                         # amount ("the loss limit is always the same"); some Topstep pages say it
                                         # stops rising at the starting balance (true here would model that)
day_rules = ["none", "2 trades", "2 losses", "-500 on the day", "-1000 on the day"]   # stop for the day after ...
sizes_mes = [10, 5]                      # contracts per trade compared (the plan trades 10)
exits = ["your exits"]                   # the owner's own exits (journal_stops also has 4/10, 5/10 ...)
combine_sims = 10000                     # Combines simulated per rule, days drawn at random from the journal
combine_max_days = 500                   # a simulated Combine that has neither passed nor failed by then is "still open"

[stop_fills]
# Owner (Oct 2026): use a stop-limit order for the stop to avoid slippage, "5 points hard limit for a loss".
# research/stop_fills.py measures on MES trades (Apr-Oct 2026) how stop-market and stop-limit stops would fill.
stops_points = [4.0, 5.0]                # stop trigger distance from the entry
limit_offsets_ticks = [0, 1, 2, 4]       # stop-limit: limit price this many ticks past the trigger (4 at a 4-point stop = 5 points)
entries_per_day = 200                    # random entry moments per session (both sides), 10:00-15:30 ET
instant_seconds = 0.005                  # stop-market fill: the worst trade price within 5 ms of the trigger (the sweep)
sweep_seconds = 0.5                      # pessimistic: the worst price within half a second
come_back_seconds = 10                   # an unfilled stop-limit: does price come back to the limit within this time?

[entry_read]
# The owner's entry read at a zone, coded from the tape (trades with the aggressor side; no order book), from the
# owner's replay notes (Oct 2026). research/entry_read.py. Every number here is a proposal (TBD) unless marked owner.
# Long at demand described below; supply is the mirror.
look_back_seconds = 60           # the push into the zone counts from 60 s before the test
window_seconds = 300             # entries up to 5 minutes after the test (the replay clips' length)
turn_points = 1.0                # the entry: price has turned 1 point off the low
break_points = 2.0               # "sellers in control": 2 points past the zone's far edge ends the read
# Signal A, "absorption, then buyers come in": a burst of aggressive selling (ES 50 / MES 100 contracts at one
# price within 0.01 s, like the owner's add-on) at the zone; price has not gone more than hold_points below it; and
# over the last other_side_seconds buyers' aggressive volume is at least other_side_ratio x sellers', delta up.
burst_zone_points = 1.0          # the burst within 1 point of the zone (above the near edge to below the far edge)
hold_points = 1.0
other_side_seconds = 20
other_side_ratio = 1.2
# Signal B, "retest with a CVD higher low" or "weaker retest": price bounces bounce_points off the first low, comes
# back within retest_points of it (at most hold_points lower), and on that second push either the CVD low is higher
# than at the first low, or the aggressive selling into it is under weaker_push_ratio of the first push.
bounce_points = 1.0
retest_points = 1.5
weaker_push_ratio = 0.7
other_side_for_retest = true     # version 2: signal B also needs the other side to come in (the owner skipped retests
                                 # while "sellers in control"); version 1 did not check it
# Order book confirmation (python -m research.entry_read --book; the owner's notes: "resting orders holding the line",
# "resting orders were being pulled off the order book as price moved downward", "no order book confirmation").
# A signal counts only if, at that second, the holding side (bids for a long) has a line in the zone area and the
# resting size there is at least what it was when the push began (refilled or stacked, not pulled or eaten away).
# Otherwise the read keeps watching. (The first run used added minus pulled; that is always positive because of
# the constant adding and cancelling near price, so it checked nothing.)
book_area_points = 1.0           # the zone area: from 1 point outside the far edge to 1 point past the near edge
book_line_multiple = 2.0         # a line = at least 2x the day's typical resting size per price (same as [book_study])
book_min_depth_change = 0        # resting size in the zone area now minus when the push began (contracts), at least this
# Filters (owner's skip reasons)
entry_from_et = "10:00"          # owner: "we don't trade the open" (10:00 proposed)
news_minutes = ["08:30", "10:00", "14:00"]   # a release minute with volume >= 3x the median of the 10 minutes before
news_spike_ratio = 3.0
news_block_minutes = 30          # owner: until volume settles, usually 30 min to an hour (30 proposed here)
use_zone_invalid_filter = false  # version 1 used it; it removed the owner's 5 best replay trades (all +10), so it is off
invalid_through_points = 1.0     # (when on) zone invalid once price traded 1 point past the far edge after it formed...
invalid_inside_minutes = 30      # ...or hung inside it (30 one-minute closes inside before the test)
fed_days = ["2024-01-31", "2024-03-20", "2024-05-01", "2024-06-12", "2024-07-31", "2024-09-18", "2024-11-07",
            "2024-12-18", "2025-01-29", "2025-03-19", "2025-05-07", "2025-06-18", "2025-07-30", "2025-09-17",
            "2025-10-29", "2025-12-10", "2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29",
            "2026-09-16", "2026-10-28"]   # owner: no trading on Fed decision days (FOMC calendar)

[replay]
# Zone replay page (research/replay_export.py, research/replay_page.py). Display settings, not bot settings.
before_seconds = 600             # the replay starts 10 minutes before the zone test
after_seconds = 300              # and stops 5 minutes after it (the bot's longest wait for a turn)
frame_seconds = 2                # heatmap and tape in 2-second frames
half_range_points = 10           # heatmap covers the zone edge +/- 10 points
depth_full_colour_x_typical = 8  # resting size at 8x the day's typical size per price shows at full colour
bubble_top_share = 0.05          # trade bubbles: the biggest 5% of the day's per-frame volume at a price
max_bubbles = 600
burst_seconds = 0.01             # absorption markers like the owner's add-on: contracts in 0.01 s...
burst_min_es = 50                # ...at least this many on ES ([book_study] burst_contracts_es)
burst_min_mes = 100              # ...and on MES (the owner's setting)
context_minutes = 15             # context chart: 15-minute candles...
context_sessions = 2             # ...for the 2 sessions before the test's session, up to the replay start
